<!DOCTYPE html>
<html lang="et" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${user.id == null ? 'Lisa kasutaja' : 'Muuda kasutajat'}">Kasutaja vorm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="mb-4" th:text="${user.id == null ? 'Lisa kasutaja' : 'Muuda kasutajat'}">Kasutaja vorm</h1>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/users/save}" th:object="${user}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="firstName" class="form-label">Eesnimi</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                                   required maxlength="255" autocomplete="given-name"
                                   aria-describedby="firstNameError">
                            <div id="firstNameError" class="invalid-feedback" th:errors="*{firstName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="lastName" class="form-label">Perekonnanimi</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                                   required maxlength="255" autocomplete="family-name"
                                   aria-describedby="lastNameError">
                            <div id="lastNameError" class="invalid-feedback" th:errors="*{lastName}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label">E-post</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   required maxlength="255" autocomplete="email"
                                   aria-describedby="emailError">
                            <div id="emailError" class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvesta</button>
                            <a th:href="@{/users}" class="btn btn-outline-secondary">Tagasi</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
