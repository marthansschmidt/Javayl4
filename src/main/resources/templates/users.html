<!DOCTYPE html>
<html lang="et" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kasutajate haldus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="mb-0">Kasutajate haldus</h1>
        <a th:href="@{/users/new}" class="btn btn-primary">Lisa uus kasutaja</a>
    </div>

    <div th:if="${#lists.isEmpty(users)}" class="alert alert-info">
        Kasutajaid ei ole veel lisatud.
    </div>

    <div th:unless="${#lists.isEmpty(users)}" class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <caption class="visually-hidden">Lisatud kasutajate nimekiri</caption>
                <thead class="table-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Eesnimi</th>
                    <th scope="col">Perekonnanimi</th>
                    <th scope="col">E-post</th>
                    <th scope="col">Tegevused</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.firstName}"></td>
                    <td th:text="${user.lastName}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/users/edit/{id}(id=${user.id})}"
                               class="btn btn-outline-primary btn-sm">Muuda</a>
                            <a th:href="@{/users/delete/{id}(id=${user.id})}"
                               class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('Kas soovid selle kasutaja kustutada?');">Kustuta</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
